name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build exe
        run: pyinstaller --noconfirm --clean PanelTracker.spec
      - name: Self-test
        shell: cmd
        run: |
          start /wait "" dist\PanelTracker.exe --selftest build\selftest
          if not exist build\selftest\punchlist.pdf exit /b 1
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: PanelTracker-windows
          path: dist/PanelTracker.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PanelTracker.exe
